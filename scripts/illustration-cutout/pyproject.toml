[project]
name = "illustration-cutout"
version = "0"
description = "Cut out and size-normalize Midjourney kanji illustrations into transparent PNG assets. Dev-only, never imported by the app."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.4,<12",
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
